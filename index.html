<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CEN FOOD | Premium Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { 
            --bg: #0b0f19;
            --surface: #141b2d;
            --surface-card: #1f293d;
            --primary: #f8fafc;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --text-sub: #94a3b8;
            --success: #10b981;
            --border: #2d3748;
            --radius-lg: 20px;
            --radius-md: 12px;
        }
        
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        body { 
            background: var(--bg); 
            color: var(--primary);
            line-height: 1.4;
            min-height: 100vh;
        }

        /* Layout Container */
        .app-container { 
            max-width: 1100px; 
            margin: 0 auto; 
            background: var(--bg); 
            min-height: 100vh; 
            position: relative;
            padding-bottom: 120px;
        }

        /* Header Layout */
        header { 
            padding: 20px 24px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            position: sticky; 
            top: 0; 
            background: rgba(11, 15, 25, 0.9); 
            backdrop-filter: blur(12px);
            z-index: 100; 
        }
        
        .logo { 
            font-size: 24px; 
            font-weight: 800; 
            letter-spacing: -1px; 
            color: #fff;
        }
        
        .logo span {
            color: var(--accent);
        }

        .wallet-badge {
            background: var(--surface);
            padding: 10px 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
        }

        .wallet-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        #user-bal { 
            font-size: 16px;
            font-weight: 800; 
            color: var(--success);
        }

        /* Rewards Banner */
        .coupon-banner { 
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); 
            color: #e2e8f0; 
            padding: 14px; 
            font-size: 13px; 
            font-weight: 700; 
            text-align: center; 
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        /* Admin Section */
        .admin-section { 
            padding: 30px 24px; 
            background: var(--surface); 
            border-bottom: 1px solid var(--border);
            margin: 20px 24px;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .admin-section h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row { 
            display: flex; 
            gap: 12px; 
        }
        
        input { 
            flex: 1; 
            padding: 14px 16px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            outline: none; 
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            background: var(--surface-card);
            color: #fff;
        }
        
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        input::placeholder {
            color: #4b5563;
        }

        .btn-add-menu { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 14px 24px; 
            border-radius: var(--radius-md); 
            font-weight: 700; 
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .btn-add-menu:hover { background: #e2e8f0; }
        .btn-add-menu:active { transform: scale(0.98); }

        /* Menu Grid layout */
        .menu-grid { 
            padding: 10px 24px 24px 24px; 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 24px; 
        }
        
        @media (min-width: 620px) { .menu-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .menu-grid { grid-template-columns: repeat(3, 1fr); } }

        .food-card { 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            background: var(--surface); 
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease; 
            position: relative; 
            border: 1px solid var(--border); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        
        .food-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            border-color: #4a5568;
        }
        
        .image-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: var(--surface-card);
            overflow: hidden;
        }

        .food-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s ease;
        }
        
        .food-card:hover .food-img {
            transform: scale(1.05);
        }

        /* Dark overlay gradient over images */
        .image-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, var(--surface) 0%, transparent 100%);
        }

        .food-details { 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--surface);
        }
        
        .food-name { 
            font-size: 18px; 
            font-weight: 700; 
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .price-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .food-price { 
            font-size: 18px;
            font-weight: 800; 
            color: #fff; 
        }

        /* Custom Action Controls */
        .add-to-cart { 
            border: 1px solid var(--border); 
            background: var(--surface-card); 
            color: #fff; 
            padding: 8px 20px; 
            border-radius: var(--radius-md); 
            font-weight: 700; 
            font-size: 13px;
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        
        .add-to-cart:hover { 
            background: #fff; 
            color: #000;
            border-color: #fff;
        }
        
        .add-to-cart:active { transform: scale(0.95); }
        
        .delete-food { 
            position: absolute; 
            top: 14px; 
            right: 14px; 
            background: rgba(11, 15, 25, 0.8); 
            color: var(--text-sub); 
            border: 1px solid var(--border); 
            border-radius: 50%; 
            width: 32px; 
            height: 32px; 
            cursor: pointer; 
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            z-index: 10;
        }
        
        .delete-food:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* Fixed Premium Footer Overlay */
        .cart-footer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            padding: 20px 24px; 
            z-index: 1000; 
            background: linear-gradient(to top, var(--bg) 60%, transparent 100%);
        }
        
        .cart-btn { 
            max-width: 1052px; 
            margin: 0 auto; 
            background: var(--accent);
            color: white; 
            padding: 16px 24px; 
            border-radius: var(--radius-md); 
            display: none; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.3); 
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .cart-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(239, 68, 68, 0.4); 
        }
        
        #cart-info {
            font-weight: 700;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 14px;
            border-radius: 8px;
        }

        .checkout-prompt {
            font-weight: 800;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">CEN<span>FOOD</span></div>
        <div class="wallet-badge">
            <span class="wallet-label">Vault Balance</span>
            <div id="user-bal">₹0.00</div>
        </div>
    </header>

    <div id="coupon-area" class="coupon-banner">Checking for rewards...</div>

    <div class="admin-section">
        <h4>Manage Restaurant Menu</h4>
        <div class="form-grid">
            <div class="input-row">
                <input type="text" id="new-name" placeholder="Dish Name (e.g. Imperial Sushi Platter)">
                <input type="number" id="new-price" placeholder="Price Matrix (INR)">
            </div>
            <div class="input-row">
                <input type="text" id="new-img" placeholder="Image Resource Address Link URL">
                <button class="btn-add-menu" onclick="saveFoodToDB()">Add to Menu</button>
            </div>
        </div>
    </div>

    <div class="menu-grid" id="menu-container">
        </div>

    <div class="cart-footer">
        <div id="cart-bar" class="cart-btn" onclick="processPayment()">
            <div id="cart-info">0 Items</div>
            <div class="checkout-prompt">Place Order & Pay System →</div>
        </div>
    </div>
</div>

<script>
    // --- 1. FIREBASE SETUP ---
    const firebaseConfig = { 
        databaseURL: "https://centrol-bank-default-rtdb.asia-southeast1.firebasedatabase.app" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userId = "pranshi_main";

    let cart = [];
    let activeDiscount = 0;

    // --- 2. PERMANENT MENU LOGIC ---
    function saveFoodToDB() {
        const name = document.getElementById('new-name').value;
        const price = document.getElementById('new-price').value;
        const img = document.getElementById('new-img').value || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400";

        if(name && price) {
            db.ref(`users/${userId}/custom_menu`).push({ name, price: parseFloat(price), img });
            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-img').value = '';
        }
    }

    function loadMenu() {
        db.ref(`users/${userId}/custom_menu`).on('value', (snapshot) => {
            const menuDiv = document.getElementById('menu-container');
            menuDiv.innerHTML = '';
            snapshot.forEach((child) => {
                const item = child.val();
                menuDiv.innerHTML += `
                    <div class="food-card">
                        <button class="delete-food" onclick="deleteFood('${child.key}')">×</button>
                        <div class="image-container">
                            <img src="${item.img}" class="food-img" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400';">
                        </div>
                        <div class="food-details">
                            <div class="food-name">${item.name}</div>
                            <div class="price-action-row">
                                <span class="food-price">₹${item.price}</span>
                                <button class="add-to-cart" onclick="addToCart('${item.name}', ${item.price})">ADD</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
    }

    function deleteFood(id) {
        if(confirm("Remove this dish from the menu?")) {
            db.ref(`users/${userId}/custom_menu/${id}`).remove();
        }
    }

    // --- 3. CART & COUPON LOGIC ---
    function addToCart(name, price) {
        cart.push({name, price});
        const bar = document.getElementById('cart-bar');
        bar.style.display = 'flex';
        document.getElementById('cart-info').innerText = `${cart.length} Item${cart.length > 1 ? 's' : ''} added`;
    }

    async function checkCoupon() {
        const snapshot = await db.ref(`users/${userId}/last_coupon`).once('value');
        const data = snapshot.val();
        const now = Date.now();
        const fortyEightHours = 48 * 60 * 60 * 1000;

        if (!data || (now - data.timestamp > fortyEightHours)) {
            const rand = Math.floor(Math.random() * 16) + 5;
            activeDiscount = rand;
            document.getElementById('coupon-area').innerHTML = `🎁 48HR GIFT: ${rand}% SYSTEM-WIDE DISCOUNT GENERATED!`;
            document.getElementById('coupon-area').style.background = "linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%)";
            await db.ref(`users/${userId}/last_coupon`).set({ timestamp: now, percent: rand, status: "available" });
        } else if (data.status === "used") {
            activeDiscount = 0;
            document.getElementById('coupon-area').style.background = "#1e293b";
            document.getElementById('coupon-area').innerText = "⏳ Coupon applied. Future reward cycles updates pending.";
        } else {
            activeDiscount = data.percent;
            document.getElementById('coupon-area').innerText = `✅ Secure Protocol: ${activeDiscount}% OFF authorization active for next ticket`;
        }
    }

    // --- 4. PAYMENT & BANK SYNC ---
    async function processPayment() {
        let rawTotal = cart.reduce((s, i) => s + i.price, 0);
        let finalTotal = activeDiscount > 0 ? rawTotal * (1 - activeDiscount/100) : rawTotal;

        const userRef = db.ref(`users/${userId}`);
        const snap = await userRef.child('balance').once('value');
        let bal = snap.val() || 0;

        if(bal >= finalTotal) {
            await userRef.child('balance').set(bal - finalTotal);
            if(activeDiscount > 0) await userRef.child('last_coupon/status').set("used");
            await userRef.child('history').push({
                amount: -finalTotal,
                description: `CEN FOOD: Order Successful`,
                timestamp: new Date().toLocaleString(),
                type: "DEBIT"
            });
            alert("Order Successful! Payment processed via CEN Bank.");
            location.reload();
        } else {
            alert("Insufficient Bank Balance!");
        }
    }

    // Update Balance Display
    db.ref(`users/${userId}/balance`).on('value', (s) => {
        document.getElementById('user-bal').innerText = `₹${(s.val() || 0).toFixed(2)}`;
    });

    loadMenu();
    checkCoupon();
</script>
</body>
</html>
