<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CEN FOOD | Premium Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { 
            --bg: #090B11;
            --surface: #121622;
            --surface-card: #1A1F30;
            --primary: #F8FAFC;
            --accent: #EF4444;
            --accent-hover: #DC2626;
            --text-sub: #94A3B8;
            --success: #10B981;
            --border: rgba(255, 255, 255, 0.06);
            --radius-lg: 24px;
            --radius-md: 14px;
        }
        
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        body { 
            background: var(--bg); 
            color: var(--primary);
            line-height: 1.4;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Layout Container */
        .app-container { 
            max-width: 1100px; 
            margin: 0 auto; 
            min-height: 100vh; 
            position: relative;
            padding-bottom: 140px;
        }

        /* Header Layout */
        header { 
            padding: 16px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            position: sticky; 
            top: 0; 
            background: rgba(9, 11, 17, 0.85); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 100; 
        }
        
        .logo { 
            font-size: 22px; 
            font-weight: 800; 
            letter-spacing: -1px; 
            color: #fff;
        }
        
        .logo span {
            color: var(--accent);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        .wallet-badge {
            background: rgba(16, 185, 129, 0.06);
            padding: 8px 14px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .wallet-label {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        #user-bal { 
            font-size: 14px;
            font-weight: 800; 
            color: var(--success);
        }

        /* Rewards Banner */
        .coupon-banner { 
            background: linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%); 
            color: #E2E8F0; 
            padding: 12px 16px; 
            font-size: 12px; 
            font-weight: 700; 
            text-align: center; 
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        /* Toggle Button System */
        .admin-toggle-btn {
            margin: 16px 20px;
            padding: 14px;
            background: var(--surface);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-md);
            color: var(--text-sub);
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .admin-toggle-btn:hover {
            color: #fff;
            border-color: var(--accent);
            background: rgba(239, 68, 68, 0.02);
        }

        /* Admin Section */
        .admin-section { 
            display: none;
            padding: 20px; 
            background: var(--surface); 
            border: 1px solid var(--border);
            margin: 0 20px 20px 20px;
            border-radius: var(--radius-lg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        
        .admin-section h4 {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 14px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap;
        }
        
        input { 
            flex: 1; 
            padding: 12px 14px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            outline: none; 
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            background: var(--surface-card);
            color: #fff;
            min-width: 160px;
        }
        
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .btn-add-menu { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 12px 24px; 
            border-radius: var(--radius-md); 
            font-weight: 800; 
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        
        .btn-add-menu:hover { background: #e2e8f0; }

        /* Mobile-First Responsive Menu Grid */
        .menu-grid { 
            padding: 4px 20px 20px 20px; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 14px; 
        }
        
        @media (max-width: 380px) {
            .menu-grid { grid-template-columns: 1fr; }
        }
        @media (min-width: 650px) { .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
        @media (min-width: 950px) { .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; } }

        /* Cleaned Structural Cards */
        .food-card { 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            background: var(--surface); 
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease; 
            position: relative; 
            border: 1px solid var(--border); 
            display: flex;
            flex-direction: column;
        }
        
        .food-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .image-container {
            position: relative;
            width: 100%;
            padding-top: 85%; /* Stable responsive image height ratio */
            background: var(--surface-card);
            overflow: hidden;
        }

        .food-img { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .image-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, var(--surface) 0%, transparent 100%);
        }

        .food-details { 
            padding: 14px; 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 10px;
        }
        
        .food-name { 
            font-size: 15px; 
            font-weight: 700; 
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .price-action-row {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .food-price { 
            font-size: 16px;
            font-weight: 800; 
            color: #fff; 
        }

        /* Dual-State Actions Engine */
        .action-group {
            display: flex;
            align-items: center;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .add-to-cart { 
            background: var(--surface-card); 
            color: #fff; 
            padding: 8px 14px; 
            border: 1px solid var(--border);
            border-radius: var(--radius-md); 
            font-weight: 700; 
            font-size: 12px;
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        
        .add-to-cart:hover { 
            background: #fff; 
            color: #000;
            border-color: #fff;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .count-display {
            font-size: 12px;
            font-weight: 800;
            min-width: 16px;
            text-align: center;
        }
        
        .delete-food { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: rgba(9, 11, 17, 0.7); 
            color: var(--text-sub); 
            border: 1px solid var(--border); 
            border-radius: 50%; 
            width: 28px; 
            height: 28px; 
            cursor: pointer; 
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        
        .delete-food:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* Floating Footer Console Overlay */
        .cart-footer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            padding: 16px 20px 24px 20px; 
            z-index: 1000; 
            background: linear-gradient(to top, var(--bg) 70%, transparent 100%);
        }
        
        .cart-btn { 
            max-width: 1060px; 
            margin: 0 auto; 
            background: var(--accent);
            color: white; 
            padding: 14px 20px; 
            border-radius: var(--radius-md); 
            display: none; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.35); 
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .cart-btn:hover {
            background: var(--accent-hover);
        }
        
        #cart-info {
            font-weight: 800;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .checkout-prompt {
            font-weight: 800;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">CEN<span>FOOD</span></div>
        <div class="wallet-badge">
            <span class="wallet-label">Vault Balance</span>
            <div id="user-bal">₹0.00</div>
        </div>
    </header>

    <div id="coupon-area" class="coupon-banner">Checking for rewards...</div>

    <div class="admin-toggle-btn" onclick="toggleAdminPanel()">⚙️ Configure Restaurant Dashboard Menu</div>
    
    <div class="admin-section" id="admin-panel">
        <h4>Manage Restaurant Menu</h4>
        <div class="form-grid">
            <div class="input-row">
                <input type="text" id="new-name" placeholder="Dish Name">
                <input type="number" id="new-price" placeholder="Price (INR)">
            </div>
            <div class="input-row">
                <input type="text" id="new-img" placeholder="Image URL Address Link">
                <button class="btn-add-menu" onclick="saveFoodToDB()">Add to Menu</button>
            </div>
        </div>
    </div>

    <div class="menu-grid" id="menu-container"></div>

    <div class="cart-footer">
        <div id="cart-bar" class="cart-btn" onclick="processPayment()">
            <div id="cart-info">0 Items added</div>
            <div class="checkout-prompt">Place Order & Pay System →</div>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = { 
        databaseURL: "https://centrol-bank-default-rtdb.asia-southeast1.firebasedatabase.app" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const userId = "pranshi_main";

    let cart = [];
    let activeDiscount = 0;

    function toggleAdminPanel() {
        const panel = document.getElementById('admin-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    // --- DB OPERATIONS ---
    function saveFoodToDB() {
        const name = document.getElementById('new-name').value;
        const price = document.getElementById('new-price').value;
        const img = document.getElementById('new-img').value || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400";

        if(name && price) {
            db.ref(`users/${userId}/custom_menu`).push({ name, price: parseFloat(price), img });
            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-img').value = '';
            toggleAdminPanel();
        }
    }

    function loadMenu() {
        db.ref(`users/${userId}/custom_menu`).on('value', (snapshot) => {
            const menuDiv = document.getElementById('menu-container');
            menuDiv.innerHTML = '';
            snapshot.forEach((child) => {
                const item = child.val();
                
                // Read current total item counts from cart structural states
                const itemCount = cart.filter(product => product.name === item.name).length;
                
                let actionMarkup = `<button class="add-to-cart" onclick="addToCart('${item.name}', ${item.price}, '${child.key}')">ADD</button>`;
                if(itemCount > 0) {
                    actionMarkup = `
                        <div class="action-group">
                            <button class="ctrl-btn" onclick="removeFromCart('${item.name}', '${child.key}')">−</button>
                            <span class="count-display">${itemCount}</span>
                            <button class="ctrl-btn" onclick="addToCart('${item.name}', ${item.price}, '${child.key}')">+</button>
                        </div>
                    `;
                }

                menuDiv.innerHTML += `
                    <div class="food-card">
                        <button class="delete-food" onclick="deleteFood('${child.key}')">×</button>
                        <div class="image-container">
                            <img src="${item.img}" class="food-img" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400';">
                        </div>
                        <div class="food-details">
                            <div class="food-name">${item.name}</div>
                            <div class="price-action-row">
                                <span class="food-price">₹${item.price.toLocaleString()}</span>
                                <div id="action-cell-${child.key}">${actionMarkup}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
    }

    function deleteFood(id) {
        if(confirm("Remove this dish from the menu?")) {
            db.ref(`users/${userId}/custom_menu/${id}`).remove();
        }
    }

    // --- MODULAR SELECTION MODIFIERS ---
    function addToCart(name, price, elementKey) {
        cart.push({name, price});
        updateCartStateUI(name, price, elementKey);
    }

    function removeFromCart(name, elementKey) {
        const index = cart.findIndex(product => product.name === name);
        if (index > -1) {
            cart.splice(index, 1);
        }
        // Grab item price profile safely from current reference context
        updateCartStateUI(name, null, elementKey);
    }

    function updateCartStateUI(name, price, elementKey) {
        const bar = document.getElementById('cart-bar');
        if(cart.length > 0) {
            bar.style.display = 'flex';
            document.getElementById('cart-info').innerText = `${cart.length} Item${cart.length > 1 ? 's' : ''} added`;
        } else {
            bar.style.display = 'none';
        }

        // Live locally scope specific UI elements to prevent full virtual grid resets
        const itemCount = cart.filter(product => product.name === name).length;
        const targetCell = document.getElementById(`action-cell-${elementKey}`);
        
        if(targetCell) {
            if(itemCount > 0) {
                // Read price structural properties contextually if needed safely
                const itemPrice = price || cart.find(product => product.name === name).price;
                targetCell.innerHTML = `
                    <div class="action-group">
                        <button class="ctrl-btn" onclick="removeFromCart('${name}', '${elementKey}')">−</button>
                        <span class="count-display">${itemCount}</span>
                        <button class="ctrl-btn" onclick="addToCart('${name}', ${itemPrice}, '${elementKey}')">+</button>
                    </div>
                `;
            } else {
                // Fetch dynamic fallbacks directly safely
                const itemPrice = price || 0;
                targetCell.innerHTML = `<button class="add-to-cart" onclick="addToCart('${name}', ${itemPrice}, '${elementKey}')">ADD</button>`;
            }
        }
    }

    // --- DISCOUNTS ---
    async function checkCoupon() {
        const snapshot = await db.ref(`users/${userId}/last_coupon`).once('value');
        const data = snapshot.val();
        const now = Date.now();
        const fortyEightHours = 48 * 60 * 60 * 1000;

        if (!data || (now - data.timestamp > fortyEightHours)) {
            const rand = Math.floor(Math.random() * 16) + 5;
            activeDiscount = rand;
            document.getElementById('coupon-area').innerHTML = `🎁 48HR GIFT: ${rand}% SYSTEM-WIDE DISCOUNT GENERATED!`;
            document.getElementById('coupon-area').style.background = "linear-gradient(135deg, #7F1D1D 0%, #450A0A 100%)";
            await db.ref(`users/${userId}/last_coupon`).set({ timestamp: now, percent: rand, status: "available" });
        } else if (data.status === "used") {
            activeDiscount = 0;
            document.getElementById('coupon-area').style.background = "#1E293B";
            document.getElementById('coupon-area').innerText = "⏳ Coupon applied. Future reward cycles updates pending.";
        } else {
            activeDiscount = data.percent;
            document.getElementById('coupon-area').innerText = `✅ Secure Protocol: ${activeDiscount}% OFF authorization active for next ticket`;
        }
    }

    // --- CHECKOUT & TRANSACTION SYNC ---
    async function processPayment() {
        let rawTotal = cart.reduce((s, i) => s + i.price, 0);
        let finalTotal = activeDiscount > 0 ? rawTotal * (1 - activeDiscount/100) : rawTotal;

        const userRef = db.ref(`users/${userId}`);
        const snap = await userRef.child('balance').once('value');
        let bal = snap.val() || 0;

        if(bal >= finalTotal) {
            await userRef.child('balance').set(bal - finalTotal);
            if(activeDiscount > 0) await userRef.child('last_coupon/status').set("used");
            await userRef.child('history').push({
                amount: -finalTotal,
                description: `CEN FOOD: Order Successful`,
                timestamp: new Date().toLocaleString(),
                type: "DEBIT"
            });
            alert("Order Successful! Payment processed via CEN Bank.");
            location.reload();
        } else {
            alert("Insufficient Bank Balance!");
        }
    }

    // Live Balance Synced Hooks
    db.ref(`users/${userId}/balance`).on('value', (s) => {
        document.getElementById('user-bal').innerText = `₹${(s.val() || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    });

    loadMenu();
    checkCoupon();
</script>
</body>
</html>
